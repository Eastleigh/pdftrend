<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Premium — PDF Trend Finder</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6C63FF; --primary-dark: #5A52E0; --primary-light: #8B85FF;
      --accent: #00D4AA; --bg: #06060B; --bg-card: #0F0F18;
      --text: #EEEEF0; --text-muted: #7878A0; --border: #1E1E35;
      --success: #22C55E; --radius: 16px;
    }
    [data-theme="light"] {
      --primary: #5A52E0; --primary-dark: #4840C0; --primary-light: #6C63FF;
      --accent: #00B894; --bg: #F5F5FA; --bg-card: #FFFFFF;
      --text: #1A1A2E; --text-muted: #6B6B8A; --border: #E0E0EE;
      --success: #16A34A;
    }
    [data-theme="light"] body::before { display: none; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 40px;
    }
    body::before {
      content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background:
        radial-gradient(circle at 30% 30%, rgba(108, 99, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(0, 212, 170, 0.06) 0%, transparent 50%);
      z-index: -1;
    }
    .success-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 48px; max-width: 520px; text-align: center;
    }
    .success-icon {
      width: 64px; height: 64px; background: rgba(34, 197, 94, 0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
      font-size: 2rem;
    }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
    h1 span { color: var(--accent); }
    p { color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; }
    .features {
      text-align: left; margin-bottom: 28px; background: rgba(108, 99, 255, 0.05);
      border: 1px solid rgba(108, 99, 255, 0.1); border-radius: 12px; padding: 20px;
    }
    .features li { list-style: none; padding: 6px 0; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
    .features .check { color: var(--success); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 14px 32px;
      border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: 700;
      text-decoration: none; cursor: pointer; transition: all 0.2s; border: none;
      background: var(--primary); color: white;
    }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">&#127881;</div>
    <h1>Welcome to <span>Premium</span></h1>
    <p>Your lifetime access is now active. No recurring charges — you own this forever.</p>
    <ul class="features">
      <li><span class="check">&#10003;</span> Unlimited searches</li>
      <li><span class="check">&#10003;</span> Save unlimited ideas</li>
      <li><span class="check">&#10003;</span> Export to CSV</li>
      <li><span class="check">&#10003;</span> PDF outline generator</li>
      <li><span class="check">&#10003;</span> Topic comparison charts</li>
    </ul>
    <a href="/search" class="btn">Start Searching</a>
  </div>
  <script>
    (function() {
      const saved = localStorage.getItem('ptf-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</body>
</html>
